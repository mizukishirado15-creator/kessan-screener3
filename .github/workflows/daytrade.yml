name: daytrade (寄り付きデイトレ検証)

on:
  workflow_dispatch: {}   # Actions画面の「Run workflow」ボタンで手動実行

concurrency:
  group: jquants
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 350    # Freeプラン(5回/分)の初回取得は2〜3時間かかる
    env:
      JQUANTS_API_KEY: ${{ secrets.JQUANTS_API_KEY }}
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
      JQUANTS_RATE_PER_MIN: ${{ vars.JQUANTS_RATE_PER_MIN }}
      DATA_DELAY_WEEKS: ${{ vars.DATA_DELAY_WEEKS }}
      MCAP_MIN_OKU: ${{ vars.MCAP_MIN_OKU }}
      MCAP_MAX_OKU: ${{ vars.MCAP_MAX_OKU }}
      RELVOL_MIN: ${{ vars.RELVOL_MIN }}
      GAP_MAX_PCT: ${{ vars.GAP_MAX_PCT }}
      COST_PCT: ${{ vars.COST_PCT }}
      TZ: Asia/Tokyo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: キャッシュ復元
        uses: actions/cache/restore@v4
        with:
          path: data/cache
          key: jq-cache-${{ github.run_id }}
          restore-keys: jq-cache-
      - name: デイトレ検証
        run: python src/daytrade_backtest.py
      - name: キャッシュ保存 (途中で止まっても取得済み分は残す)
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data/cache
          key: jq-cache-${{ github.run_id }}
      - name: 結果ファイル
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daytrade-results
          path: results/
